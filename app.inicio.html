<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DptoLibre - SuperApp Administrador V4.5</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --brand-blue: #0055DD;
            --brand-dark: #0D1B4B;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #cbd5e1;
            -webkit-tap-highlight-color: transparent;
        }

        .mobile-shell {
            width: 100%;
            height: 100vh;
            max-width: 414px;
            margin: 0 auto;
            background: #F0F2F6;
            position: relative;
            overflow: hidden;
            box-shadow: 0 40px 100px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .animate-in { animation: fadeIn 0.3s ease-out; }
        .slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name, size, className]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        function AdminSuperApp() {
            const [activeTab, setActiveTab] = useState('torre');
            const [isFabOpen, setIsFabOpen] = useState(false);

            // --- 1. VISTA TORRE (DASHBOARD & TESORERÍA) ---
            const TorreView = () => (
                <div className="flex-1 overflow-y-auto no-scrollbar pb-32 animate-in">
                    <header className="p-6 bg-slate-900 text-white flex justify-between items-center rounded-b-[2.5rem] shadow-xl relative z-10">
                        <div className="absolute top-4 right-4 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[9px] font-black uppercase px-2 py-0.5 rounded tracking-wider">
                            V4.5
                        </div>
                        <div className="flex items-center gap-3 mt-4">
                            <div className="w-12 h-12 rounded-full border-2 border-emerald-400 overflow-hidden bg-slate-800 flex-shrink-0 relative">
                                <img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?w=150&q=80" alt="Admin" className="w-full h-full object-cover" />
                            </div>
                            <div>
                                <h3 className="text-sm font-black leading-tight tracking-tight">Estudio Raíces</h3>
                                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">Admin Partner</p>
                            </div>
                        </div>
                        <button className="relative w-10 h-10 flex items-center justify-center bg-slate-800 hover:bg-slate-700 rounded-xl transition mt-4">
                            <Icon name="bell" size={20} className="text-slate-300" />
                            <span className="absolute top-2 right-2 w-2 h-2 bg-rose-500 rounded-full animate-pulse"></span>
                        </button>
                    </header>

                    <main className="p-6 space-y-6 -mt-4 relative z-0">
                        {/* Tesorería Desglosada */}
                        <div className="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm space-y-4">
                            <div className="flex justify-between items-start">
                                <div>
                                    <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Saldo Total Consolidado</p>
                                    <h2 className="text-3xl font-black text-[#0D1B4B] tracking-tighter mt-1">$4.240.500</h2>
                                </div>
                            </div>
                            
                            <div className="grid grid-cols-3 gap-2 bg-slate-50 p-3 rounded-xl border border-slate-100">
                                <div className="text-center border-r border-slate-200">
                                    <p className="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">Alquileres</p>
                                    <p className="text-xs font-black text-slate-800">$3.000k</p>
                                </div>
                                <div className="text-center border-r border-slate-200">
                                    <p className="text-[9px] font-black text-emerald-500 uppercase tracking-widest mb-1">Comisiones</p>
                                    <p className="text-xs font-black text-emerald-700">$1.200k</p>
                                </div>
                                <div className="text-center">
                                    <p className="text-[9px] font-black text-indigo-500 uppercase tracking-widest mb-1">Intereses</p>
                                    <p className="text-xs font-black text-indigo-700">$40.5k</p>
                                </div>
                            </div>

                            <div className="flex flex-col gap-2">
                                <button onClick={() => alert("Barrido automático ejecutado. Alquileres transferidos a las cuentas de los dueños.")} className="w-full bg-[#0D1B4B] text-white py-3.5 rounded-xl font-black text-[10px] uppercase tracking-widest shadow-lg flex justify-center items-center gap-2 active:scale-95 transition-all">
                                    <Icon name="send" size={14}/> Derivar Alquileres a Dueños
                                </button>
                                <button onClick={() => alert("Retiro de honorarios a tu CBU programado.")} className="w-full bg-emerald-50 text-emerald-700 border border-emerald-200 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest active:scale-95 transition-all">
                                    Retirar Mis Comisiones
                                </button>
                            </div>
                        </div>

                        {/* Torre Métricas Rápidas */}
                        <div className="grid grid-cols-3 gap-3">
                            <div className="bg-white p-4 rounded-2xl border shadow-sm flex flex-col items-center text-center">
                                <span className="w-8 h-8 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center mb-2"><Icon name="check-circle-2" size={16}/></span>
                                <h5 className="text-xl font-black text-slate-800">42</h5>
                                <p className="text-[9px] font-bold text-slate-400 uppercase mt-0.5">Activas</p>
                            </div>
                            <div className="bg-white p-4 rounded-2xl border shadow-sm flex flex-col items-center text-center">
                                <span className="w-8 h-8 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center mb-2"><Icon name="key" size={16}/></span>
                                <h5 className="text-xl font-black text-slate-800">3</h5>
                                <p className="text-[9px] font-bold text-slate-400 uppercase mt-0.5">Vacantes</p>
                            </div>
                            <div className="bg-white p-4 rounded-2xl border shadow-sm flex flex-col items-center text-center border-b-2 border-b-rose-500">
                                <span className="w-8 h-8 rounded-full bg-rose-50 text-rose-600 flex items-center justify-center mb-2"><Icon name="alert-triangle" size={16}/></span>
                                <h5 className="text-xl font-black text-slate-800">2</h5>
                                <p className="text-[9px] font-bold text-slate-400 uppercase mt-0.5">En Mora</p>
                            </div>
                        </div>
                    </main>
                </div>
            );

            // --- 2. VISTA CARTERA (PROPIEDADES & USUARIOS) ---
            const CarteraView = () => (
                <div className="flex-1 overflow-y-auto no-scrollbar pb-32 animate-in bg-[#F0F2F6]">
                    <header className="p-6 bg-white border-b sticky top-0 z-10 flex justify-between items-center">
                        <h2 className="text-xl font-black text-[#0D1B4B] tracking-tighter">Mi Cartera</h2>
                        <span className="bg-blue-50 text-[#0055DD] px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest">45 Unidades</span>
                    </header>
                    <div className="p-6 space-y-4">
                        {[
                            { addr: "Av. Colón 450, 10C", tenant: "Lucía Martínez", owner: "Marcos Galperin", status: "Alquilada", statusColor: "emerald" },
                            { addr: "Caseros 1230, 4B", tenant: "Vacante", owner: "Eduardo Costantini", status: "Vacante", statusColor: "amber" },
                            { addr: "Velez Sarsfield 30, 2A", tenant: "Juan Pérez", owner: "Roberto Sánchez", status: "Mora (Día 6)", statusColor: "rose" },
                            { addr: "San Martín 150, 1B", tenant: "Ana Gómez", owner: "Marcos Galperin", status: "Alquilada", statusColor: "emerald" }
                        ].map((prop, i) => (
                            <div key={i} className="bg-white p-4 rounded-2xl border shadow-sm">
                                <div className="flex justify-between items-start mb-3">
                                    <h4 className="font-black text-slate-800 text-sm">{prop.addr}</h4>
                                    <span className={`text-[9px] font-black uppercase px-2 py-0.5 rounded bg-${prop.statusColor}-50 text-${prop.statusColor}-600`}>{prop.status}</span>
                                </div>
                                <div className="flex justify-between text-xs">
                                    <div className="flex flex-col">
                                        <span className="text-[9px] font-bold text-slate-400 uppercase">Inquilino</span>
                                        <span className="font-semibold text-slate-700">{prop.tenant}</span>
                                    </div>
                                    <div className="flex flex-col text-right">
                                        <span className="text-[9px] font-bold text-slate-400 uppercase">Propietario</span>
                                        <span className="font-semibold text-slate-700">{prop.owner}</span>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );

            // --- 3. VISTA DOCS (CONTRATOS) ---
            const DocsView = () => (
                <div className="flex-1 overflow-y-auto no-scrollbar pb-32 animate-in bg-[#F0F2F6]">
                    <header className="p-6 bg-white border-b sticky top-0 z-10 flex justify-between items-center">
                        <h2 className="text-xl font-black text-[#0D1B4B] tracking-tighter">Contratos</h2>
                        <Icon name="search" size={20} className="text-slate-400"/>
                    </header>
                    <div className="p-6 space-y-4">
                        {[
                            { id: "CNT-8901", prop: "Av. Colón 450", date: "Vence: 05/2028", status: "Vigente" },
                            { id: "CNT-8902", prop: "San Martín 150", date: "Vence: 10/2026", status: "Próx. a Vencer" },
                            { id: "CNT-8903", prop: "Velez Sarsfield 30", date: "Vence: 12/2027", status: "Vigente" }
                        ].map((doc, i) => (
                            <div key={i} className="bg-white p-4 rounded-2xl border shadow-sm flex items-center justify-between">
                                <div className="flex items-center gap-4">
                                    <div className="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center">
                                        <Icon name="file-text" size={20}/>
                                    </div>
                                    <div>
                                        <h4 className="font-black text-slate-800 text-xs">{doc.prop}</h4>
                                        <p className="text-[10px] text-slate-500 font-mono mt-0.5">{doc.id} • {doc.date}</p>
                                    </div>
                                </div>
                                <Icon name="download" size={18} className="text-[#0055DD]"/>
                            </div>
                        ))}
                    </div>
                </div>
            );

            // --- 4. VISTA PERFIL (MICROSITIO DE CONFIGURACIÓN) ---
            const PerfilView = () => (
                <div className="flex-1 overflow-y-auto no-scrollbar pb-32 animate-in bg-white">
                    <header className="p-6 bg-slate-900 text-white flex flex-col items-center justify-center pt-12 pb-8 rounded-b-[2.5rem]">
                        <div className="w-20 h-20 rounded-full border-4 border-[#0055DD] overflow-hidden bg-slate-800 relative shadow-xl">
                            <img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?w=200&q=80" alt="Admin" className="w-full h-full object-cover" />
                        </div>
                        <h2 className="text-xl font-black mt-4">Estudio Raíces</h2>
                        <p className="text-xs text-slate-400 font-medium">admin@raices.com</p>
                        <span className="mt-3 bg-[#0055DD]/20 text-[#00D1FF] border border-[#0055DD]/50 text-[10px] font-black uppercase px-3 py-1 rounded-full tracking-wider">Cuenta Master (Admin)</span>
                    </header>

                    <div className="p-6 space-y-6">
                        {/* Operaciones de Cuenta */}
                        <div>
                            <h4 className="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1 mb-3">Administración de Equipo</h4>
                            <div className="bg-slate-50 rounded-2xl border border-slate-100 overflow-hidden">
                                <button onClick={() => alert("Generando link de invitación para nuevo administrador...")} className="w-full p-4 flex items-center justify-between hover:bg-slate-100 transition border-b border-slate-100">
                                    <div className="flex items-center gap-3">
                                        <div className="w-8 h-8 bg-emerald-100 text-emerald-600 rounded-lg flex items-center justify-center"><Icon name="user-plus" size={16}/></div>
                                        <span className="text-sm font-bold text-slate-700">Agregar Administrador</span>
                                    </div>
                                    <Icon name="chevron-right" size={16} className="text-slate-400"/>
                                </button>
                                <button onClick={() => alert("Lista de agentes autorizados.")} className="w-full p-4 flex items-center justify-between hover:bg-slate-100 transition">
                                    <div className="flex items-center gap-3">
                                        <div className="w-8 h-8 bg-blue-100 text-[#0055DD] rounded-lg flex items-center justify-center"><Icon name="users" size={16}/></div>
                                        <span className="text-sm font-bold text-slate-700">Gestionar Permisos</span>
                                    </div>
                                    <Icon name="chevron-right" size={16} className="text-slate-400"/>
                                </button>
                            </div>
                        </div>

                        {/* Seguridad */}
                        <div>
                            <h4 className="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1 mb-3">Seguridad</h4>
                            <div className="bg-slate-50 rounded-2xl border border-slate-100 overflow-hidden">
                                <button onClick={() => alert("Flujo de reseteo de contraseña iniciado por mail.")} className="w-full p-4 flex items-center justify-between hover:bg-slate-100 transition border-b border-slate-100">
                                    <div className="flex items-center gap-3">
                                        <div className="w-8 h-8 bg-amber-100 text-amber-600 rounded-lg flex items-center justify-center"><Icon name="lock" size={16}/></div>
                                        <span className="text-sm font-bold text-slate-700">Resetear Contraseña</span>
                                    </div>
                                    <Icon name="chevron-right" size={16} className="text-slate-400"/>
                                </button>
                                <button onClick={() => alert("Ajustes de biometría y FaceID.")} className="w-full p-4 flex items-center justify-between hover:bg-slate-100 transition">
                                    <div className="flex items-center gap-3">
                                        <div className="w-8 h-8 bg-indigo-100 text-indigo-600 rounded-lg flex items-center justify-center"><Icon name="scan-face" size={16}/></div>
                                        <span className="text-sm font-bold text-slate-700">Biometría (Face ID)</span>
                                    </div>
                                    <Icon name="chevron-right" size={16} className="text-slate-400"/>
                                </button>
                            </div>
                        </div>

                        {/* Zona de Peligro */}
                        <div className="pt-4">
                            <button onClick={() => alert("Sesión finalizada.")} className="w-full py-4 bg-slate-100 text-slate-700 rounded-2xl font-black text-xs uppercase tracking-widest mb-3 hover:bg-slate-200 transition">
                                Cerrar Sesión
                            </button>
                            <button onClick={() => confirm("¿Estás seguro que deseas dar de baja toda la cuenta Master? Esta acción es irreversible.")} className="w-full py-4 text-rose-500 rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-rose-50 border border-transparent hover:border-rose-100 transition">
                                Dar de Baja Cuenta
                            </button>
                        </div>
                    </div>
                </div>
            );

            // --- MENU ACCIÓN FLOTANTE (FAB) ---
            const FabMenu = () => {
                if (!isFabOpen) return null;
                return (
                    <div className="absolute inset-0 z-40 flex items-end justify-center pb-28 bg-slate-900/40 backdrop-blur-sm slide-up" onClick={() => setIsFabOpen(false)}>
                        <div className="bg-white w-[90%] rounded-3xl p-6 shadow-2xl flex flex-col gap-4" onClick={(e) => e.stopPropagation()}>
                            <h3 className="text-xs font-black text-slate-400 uppercase tracking-widest text-center mb-2">Crear Nuevo Registro</h3>
                            <div className="grid grid-cols-2 gap-3">
                                <button onClick={() => { alert("Iniciando Asistente: Alta de Propiedad (Flow AI)"); setIsFabOpen(false); }} className="p-4 bg-emerald-50 rounded-2xl border border-emerald-100 flex flex-col items-center justify-center gap-2 hover:bg-emerald-100 transition">
                                    <Icon name="home" size={24} className="text-emerald-600"/>
                                    <span className="text-[10px] font-black text-emerald-800 uppercase">Propiedad</span>
                                </button>
                                <button onClick={() => { alert("Iniciando Asistente: Alta de Inquilino/Propietario"); setIsFabOpen(false); }} className="p-4 bg-blue-50 rounded-2xl border border-blue-100 flex flex-col items-center justify-center gap-2 hover:bg-blue-100 transition">
                                    <Icon name="users" size={24} className="text-[#0055DD]"/>
                                    <span className="text-[10px] font-black text-[#0055DD] uppercase">Usuario</span>
                                </button>
                                <button onClick={() => { alert("Iniciando Asistente: Generación de Contrato Legal"); setIsFabOpen(false); }} className="p-4 bg-indigo-50 rounded-2xl border border-indigo-100 flex flex-col items-center justify-center gap-2 hover:bg-indigo-100 transition col-span-2">
                                    <Icon name="file-signature" size={24} className="text-indigo-600"/>
                                    <span className="text-[10px] font-black text-indigo-800 uppercase">Contrato Nuevo</span>
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="h-screen w-full flex flex-col items-center justify-center p-4 bg-[#cbd5e1]">
                    <div className="mobile-shell rounded-[3rem] border-[6px] border-white ring-1 ring-slate-200 shadow-2xl">
                        
                        {/* Area de Contenido Dinámico */}
                        {activeTab === 'torre' && <TorreView />}
                        {activeTab === 'cartera' && <CarteraView />}
                        {activeTab === 'docs' && <DocsView />}
                        {activeTab === 'perfil' && <PerfilView />}

                        {/* Menú Overlay FAB */}
                        <FabMenu />

                        {/* Botón de Acción Flotante (FAB) centralizado */}
                        <button 
                            onClick={() => setIsFabOpen(!isFabOpen)}
                            className={`absolute bottom-[5rem] left-1/2 -translate-x-1/2 w-14 h-14 bg-[#0055DD] text-white rounded-full flex items-center justify-center shadow-[0_10px_25px_rgba(0,85,221,0.5)] z-50 transition-transform duration-300 ${isFabOpen ? 'rotate-45 bg-rose-500 shadow-rose-500/50' : 'active:scale-95 hover:-translate-y-1'}`}
                        >
                            <Icon name="plus" size={28} />
                        </button>

                        {/* Nav inferior */}
                        <nav className="absolute bottom-0 w-full bg-white/95 backdrop-blur-md border-t border-slate-200 px-6 py-4 flex justify-between items-center pb-8 z-30">
                            <button onClick={() => {setActiveTab('torre'); setIsFabOpen(false);}} className={`flex flex-col items-center gap-1 transition-colors w-12 ${activeTab === 'torre' ? 'text-[#0055DD]' : 'text-slate-400'}`}>
                                <Icon name="layout-dashboard" size={22} />
                                <span className="text-[8px] font-black uppercase tracking-wider">Torre</span>
                            </button>
                            <button onClick={() => {setActiveTab('cartera'); setIsFabOpen(false);}} className={`flex flex-col items-center gap-1 transition-colors w-12 pr-4 ${activeTab === 'cartera' ? 'text-[#0055DD]' : 'text-slate-400'}`}>
                                <Icon name="building-2" size={22} />
                                <span className="text-[8px] font-black uppercase tracking-wider">Cartera</span>
                            </button>
                            
                            {/* Espacio vacío para el FAB */}
                            <div className="w-12"></div>

                            <button onClick={() => {setActiveTab('docs'); setIsFabOpen(false);}} className={`flex flex-col items-center gap-1 transition-colors w-12 pl-4 ${activeTab === 'docs' ? 'text-[#0055DD]' : 'text-slate-400'}`}>
                                <Icon name="file-text" size={22} />
                                <span className="text-[8px] font-black uppercase tracking-wider">Docs</span>
                            </button>
                            <button onClick={() => {setActiveTab('perfil'); setIsFabOpen(false);}} className={`flex flex-col items-center gap-1 transition-colors w-12 ${activeTab === 'perfil' ? 'text-[#0055DD]' : 'text-slate-400'}`}>
                                <Icon name="settings" size={22} />
                                <span className="text-[8px] font-black uppercase tracking-wider">Perfil</span>
                            </button>
                        </nav>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminSuperApp />);
    </script>
</body>
</html>
