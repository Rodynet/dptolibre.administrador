<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DptoLibre - Sistema Operativo V75</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --brand-blue: #0055DD;
            --brand-dark: #0D1B4B;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #cbd5e1;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }

        .mobile-shell {
            width: 100%;
            height: 100vh;
            max-width: 414px;
            margin: 0 auto;
            background: #F0F2F6;
            position: relative;
            overflow: hidden;
            box-shadow: 0 40px 100px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .animate-in { animation: fadeIn 0.3s ease-out; }
        .slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); forwards; }
        .slide-in-right { animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1); forwards; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }

        /* Chat Styles */
        .bot-bubble { @apply bg-white border border-slate-100 p-4 rounded-tr-[1.5rem] rounded-br-[1.5rem] rounded-bl-[1.5rem] shadow-sm max-w-[85%] text-sm font-medium leading-relaxed text-slate-700; }
        .user-bubble { @apply bg-[#0055DD] text-white p-4 rounded-tl-[1.5rem] rounded-bl-[1.5rem] rounded-br-[1.5rem] shadow-lg max-w-[80%] text-sm font-bold ml-auto; }
        .typing-dot { width: 5px; height: 5px; background: #94a3b8; border-radius: 50%; animation: typing 1.4s infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name, size, className]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        // --- MOCK DATA ---
        const mockPropiedades = [
            { id: 1, addr: "Av. Colón 450, 10C", owner: "Marcos Galperin", tenant: "Lucía Martínez", status: "Alquilada", statusColor: "emerald" },
            { id: 2, addr: "Caseros 1230, 4B", owner: "Eduardo Costantini", tenant: "Vacante", status: "Vacante", statusColor: "amber" },
            { id: 3, addr: "Velez Sarsfield 30, 2A", owner: "Roberto Sánchez", tenant: "Juan Pérez", status: "Mora (Día 6)", statusColor: "rose" },
            { id: 4, addr: "San Martín 150, 1B", owner: "Marcos Galperin", tenant: "Ana Gómez", status: "Alquilada", statusColor: "emerald" }
        ];

        const mockUsuarios = [
            { id: 1, name: "Marcos Galperin", role: "Propietario", email: "marcos@email.com", phone: "+5491100001111", score: 950 },
            { id: 2, name: "Lucía Martínez", role: "Inquilino", email: "lucia@email.com", phone: "+5493510002222", score: 820 },
            { id: 3, name: "Juan Pérez", role: "Inquilino", email: "juan@email.com", phone: "+5493510003333", score: 650 },
            { id: 4, name: "Eduardo Costantini", role: "Propietario", email: "eduardo@email.com", phone: "+5491100004444", score: 880 }
        ];

        const mockContratos = [
            { id: "CNT-8901", prop: "Av. Colón 450", tenant: "Lucía M.", owner: "Marcos G.", date: "Vence: 05/2028", status: "Vigente" },
            { id: "CNT-8902", prop: "San Martín 150", tenant: "Ana G.", owner: "Marcos G.", date: "Vence: 10/2026", status: "Próx. a Vencer" },
            { id: "CNT-8903", prop: "Velez Sarsfield 30", tenant: "Juan P.", owner: "Roberto S.", date: "Vence: 12/2027", status: "Vigente" }
        ];

        function AdminSuperApp() {
            // Estados de Navegación Principal
            const [activeTab, setActiveTab] = useState('inicio');
            const [isFabOpen, setIsFabOpen] = useState(false);
            
            // Estados de Overlays (Mantenidos de V4.8 y expandidos)
            const [isProfileOpen, setIsProfileOpen] = useState(false);
            const [withdrawMode, setWithdrawMode] = useState(null); // 'dueños' or 'comisiones'
            const [fullMetricsOpen, setFullMetricsOpen] = useState(false);
            
            // Estados de ABM y Asistentes
            const [selectedEntity, setSelectedEntity] = useState(null); // { type: 'propiedad'|'usuario'|'contrato', data: object }
            const [aiFlow, setAiFlow] = useState(null); // 'propiedad' | 'usuario' | 'contrato'

            // --- HEADER COMÚN & PERFIL (V4.8 Restored) ---
            const AppHeader = () => (
                <header className="p-6 bg-slate-900 text-white flex justify-between items-center rounded-b-[2rem] shadow-xl relative z-10">
                    <div className="absolute top-3 right-4 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[9px] font-black uppercase px-2 py-0.5 rounded tracking-wider">
                        V75
                    </div>
                    <div className="flex items-center gap-3 mt-4" onClick={() => setIsProfileOpen(true)}>
                        <div className="w-12 h-12 rounded-full border-2 border-emerald-400 overflow-hidden bg-slate-800 flex-shrink-0 relative cursor-pointer active:scale-95 transition">
                            <img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?w=150&q=80" alt="Admin" className="w-full h-full object-cover" />
                            <div className="absolute bottom-0 right-0 w-3 h-3 bg-[#00D1FF] border-2 border-slate-900 rounded-full"></div>
                        </div>
                        <div className="cursor-pointer">
                            <h3 className="text-sm font-black leading-tight tracking-tight flex items-center gap-1">
                                Estudio Raíces <Icon name="chevron-down" size={12} className="text-slate-400"/>
                            </h3>
                            <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">Admin Partner</p>
                        </div>
                    </div>
                    <button className="relative w-10 h-10 flex items-center justify-center bg-slate-800 hover:bg-slate-700 rounded-xl transition mt-4">
                        <Icon name="bell" size={20} className="text-slate-300" />
                        <span className="absolute top-2 right-2 w-2 h-2 bg-rose-500 rounded-full animate-pulse"></span>
                    </button>
                </header>
            );

            // --- MODAL DE PERFIL (V4.8 Restored) ---
            const ProfileDrawer = () => {
                if (!isProfileOpen) return null;
                return (
                    <div className="absolute inset-0 z-50 flex flex-col justify-end bg-slate-900/60 backdrop-blur-sm animate-in">
                        <div className="bg-white w-full rounded-t-[2.5rem] p-6 shadow-2xl slide-up flex flex-col h-[85vh]">
                            <div className="flex justify-between items-start mb-6">
                                <div className="flex gap-4 items-center">
                                    <div className="w-16 h-16 rounded-full border-2 border-[#0055DD] overflow-hidden">
                                        <img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?w=150&q=80" className="w-full h-full object-cover" />
                                    </div>
                                    <div>
                                        <h3 className="text-xl font-black text-[#0D1B4B] tracking-tighter leading-none">Estudio Raíces</h3>
                                        <p className="text-xs text-slate-400 font-medium mt-1">admin@raices.com</p>
                                    </div>
                                </div>
                                <button onClick={() => setIsProfileOpen(false)} className="w-8 h-8 bg-slate-100 text-slate-500 rounded-full flex items-center justify-center"><Icon name="x" size={16}/></button>
                            </div>

                            <div className="flex-1 overflow-y-auto no-scrollbar space-y-6">
                                <div>
                                    <h4 className="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1 mb-2">Mi Equipo</h4>
                                    <div className="bg-slate-50 rounded-2xl border border-slate-100 overflow-hidden">
                                        <button onClick={() => alert("Generando link de invitación...")} className="w-full p-4 flex items-center justify-between hover:bg-slate-100 transition border-b border-slate-100">
                                            <div className="flex items-center gap-3">
                                                <div className="w-8 h-8 bg-emerald-100 text-emerald-600 rounded-lg flex items-center justify-center"><Icon name="user-plus" size={16}/></div>
                                                <span className="text-sm font-bold text-slate-700">Agregar Administrador</span>
                                            </div>
                                            <Icon name="chevron-right" size={16} className="text-slate-400"/>
                                        </button>
                                        <button className="w-full p-4 flex items-center justify-between hover:bg-slate-100 transition">
                                            <div className="flex items-center gap-3">
                                                <div className="w-8 h-8 bg-blue-100 text-[#0055DD] rounded-lg flex items-center justify-center"><Icon name="users" size={16}/></div>
                                                <span className="text-sm font-bold text-slate-700">Gestionar Permisos</span>
                                            </div>
                                            <Icon name="chevron-right" size={16} className="text-slate-400"/>
                                        </button>
                                    </div>
                                </div>
                                <div>
                                    <h4 className="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1 mb-2">Seguridad</h4>
                                    <div className="bg-slate-50 rounded-2xl border border-slate-100 overflow-hidden">
                                        <button className="w-full p-4 flex items-center justify-between hover:bg-slate-100 transition border-b border-slate-100">
                                            <div className="flex items-center gap-3">
                                                <div className="w-8 h-8 bg-amber-100 text-amber-600 rounded-lg flex items-center justify-center"><Icon name="lock" size={16}/></div>
                                                <span className="text-sm font-bold text-slate-700">Resetear Contraseña</span>
                                            </div>
                                            <Icon name="chevron-right" size={16} className="text-slate-400"/>
                                        </button>
                                    </div>
                                </div>
                                <div className="pt-4">
                                    <button onClick={() => {alert("Deslogueado."); setIsProfileOpen(false);}} className="w-full py-4 bg-slate-100 text-slate-700 rounded-2xl font-black text-xs uppercase tracking-widest mb-3 hover:bg-slate-200 transition">
                                        Cerrar Sesión
                                    </button>
                                    <button className="w-full py-4 text-rose-500 rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-rose-50 border border-transparent transition">
                                        Dar de Baja Cuenta
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            // --- MODAL DE LIQUIDACIÓN PARCIAL/TOTAL (V4.8 Restored) ---
            const WithdrawModal = () => {
                if (!withdrawMode) return null;
                const isDueños = withdrawMode === 'dueños';
                const [montoType, setMontoType] = useState('total'); // 'total' | 'parcial'
                const [customMonto, setCustomMonto] = useState(isDueños ? "3000000" : "1200000");
                const [contracts, setContracts] = useState([
                    { id: 1, addr: "Av. Colón 450", amount: 450000, checked: true },
                    { id: 2, addr: "San Martín 150", amount: 350000, checked: true },
                    { id: 3, addr: "Caseros 1230", amount: 400000, checked: true }
                ]);

                return (
                    <div className="absolute inset-0 z-50 flex flex-col justify-end bg-slate-900/60 backdrop-blur-sm animate-in">
                        <div className="bg-white w-full rounded-t-[2.5rem] p-6 shadow-2xl slide-up flex flex-col h-[85vh]">
                            <div className="flex justify-between items-center mb-6">
                                <div>
                                    <h3 className="text-xl font-black text-[#0D1B4B] tracking-tighter leading-none">
                                        {isDueños ? "Derivar a Dueños" : "Retirar Comisiones"}
                                    </h3>
                                    <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">
                                        Saldo Disp: {isDueños ? "$3.000.000" : "$1.200.000"}
                                    </p>
                                </div>
                                <button onClick={() => setWithdrawMode(null)} className="w-8 h-8 bg-slate-100 text-slate-500 rounded-full flex items-center justify-center"><Icon name="x" size={16}/></button>
                            </div>

                            <div className="flex-1 overflow-y-auto no-scrollbar space-y-5">
                                <div className="space-y-3">
                                    <h4 className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Monto a Operar</h4>
                                    <div className="flex gap-2">
                                        <button onClick={() => setMontoType('total')} className={`flex-1 py-3 rounded-xl font-black text-[10px] uppercase border ${montoType === 'total' ? 'bg-indigo-50 border-indigo-200 text-indigo-700' : 'bg-white border-slate-200 text-slate-400'}`}>
                                            Rendir Total
                                        </button>
                                        <button onClick={() => setMontoType('parcial')} className={`flex-1 py-3 rounded-xl font-black text-[10px] uppercase border ${montoType === 'parcial' ? 'bg-indigo-50 border-indigo-200 text-indigo-700' : 'bg-white border-slate-200 text-slate-400'}`}>
                                            Monto Parcial
                                        </button>
                                    </div>
                                    {montoType === 'parcial' && (
                                        <div className="relative">
                                            <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-black">$</span>
                                            <input type="number" value={customMonto} onChange={(e) => setCustomMonto(e.target.value)} className="w-full bg-slate-50 border border-slate-200 px-8 py-3.5 rounded-xl text-lg font-black text-slate-800 outline-none focus:border-[#0055DD]" />
                                        </div>
                                    )}
                                </div>

                                <div className="space-y-3">
                                    <div className="flex justify-between items-center">
                                        <h4 className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Contratos a Liquidar</h4>
                                        <span className="text-[9px] font-bold text-[#0055DD]">{contracts.filter(c=>c.checked).length} seleccionados</span>
                                    </div>
                                    <div className="space-y-2">
                                        {contracts.map(c => (
                                            <label key={c.id} className={`flex items-center justify-between p-3 rounded-xl border cursor-pointer transition ${c.checked ? 'bg-blue-50/50 border-blue-200' : 'bg-white border-slate-100 opacity-60'}`}>
                                                <div className="flex items-center gap-3">
                                                    <input type="checkbox" checked={c.checked} onChange={() => setContracts(contracts.map(x => x.id === c.id ? {...x, checked: !x.checked} : x))} className="w-4 h-4 rounded text-[#0055DD] focus:ring-[#0055DD]" />
                                                    <span className="font-black text-xs text-slate-800">{c.addr}</span>
                                                </div>
                                                <span className="font-bold text-slate-500 text-xs">${c.amount.toLocaleString()}</span>
                                            </label>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            <button onClick={() => { alert("Operación iniciada."); setWithdrawMode(null); }} className="w-full bg-[#0D1B4B] text-white py-4 rounded-xl font-black text-xs uppercase tracking-widest shadow-xl mt-4 active:scale-95 transition">
                                Confirmar Transferencia
                            </button>
                        </div>
                    </div>
                );
            };

            // --- OVERLAY: FULL METRICS (Ver todo) ---
            const FullMetricsModal = () => {
                if (!fullMetricsOpen) return null;
                return (
                    <div className="absolute inset-0 z-[60] bg-[#F0F2F6] flex flex-col animate-in slide-up">
                        <header className="p-6 bg-white flex justify-between items-center border-b">
                            <div><h2 className="text-xl font-black text-[#0D1B4B] tracking-tighter">Métricas de Cartera</h2></div>
                            <button onClick={() => setFullMetricsOpen(false)} className="bg-slate-100 p-2 rounded-full text-slate-500"><Icon name="x" size={20}/></button>
                        </header>
                        <div className="flex-1 overflow-y-auto p-6 space-y-6">
                            <div className="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm text-center">
                                <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Recaudación Bruta</p>
                                <h3 className="text-3xl font-black text-slate-900 mt-1">$12.540.800</h3>
                            </div>
                            <div className="bg-slate-900 p-6 rounded-[2rem] shadow-xl text-center text-white relative overflow-hidden">
                                <Icon name="zap" className="absolute right-[-10px] top-[-10px] text-white/5" size={80}/>
                                <p className="text-[10px] font-black text-[#00D1FF] uppercase tracking-widest relative z-10">Mis Ganancias (Comisiones)</p>
                                <h3 className="text-3xl font-black mt-1 relative z-10">$840.500</h3>
                            </div>
                            <div className="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm text-center">
                                <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Saldo de Dueños</p>
                                <h3 className="text-3xl font-black text-slate-800 mt-1">$7.820.000</h3>
                            </div>
                        </div>
                    </div>
                );
            };

            // --- OVERLAY: ABM ENTIDAD (Detalle con acciones) ---
            const EntityABMModal = () => {
                if (!selectedEntity) return null;
                const { type, data } = selectedEntity;
                // Parseamos titulo/subtitulo según la entidad
                const title = type === 'Propiedad' ? data.addr : type === 'Usuario' ? data.name : data.id;
                const subtitle = type === 'Propiedad' ? `Dueño: ${data.owner}` : type === 'Usuario' ? data.role : data.prop;

                return (
                    <div className="absolute inset-0 z-[60] bg-slate-900/60 backdrop-blur-sm flex justify-end animate-in">
                        <div className="bg-white w-[90%] max-w-sm h-full shadow-2xl flex flex-col slide-in-right">
                            <header className="p-6 border-b border-slate-100 flex justify-between items-start bg-slate-50">
                                <div>
                                    <span className="text-[9px] font-black text-[#0055DD] uppercase tracking-widest bg-blue-50 px-2 py-0.5 rounded">{type}</span>
                                    <h2 className="text-xl font-black text-slate-900 tracking-tight mt-2 leading-tight">{title}</h2>
                                    <p className="text-xs font-bold text-slate-500 uppercase mt-1">{subtitle}</p>
                                </div>
                                <button onClick={() => setSelectedEntity(null)} className="p-2 bg-white border border-slate-200 rounded-full text-slate-400"><Icon name="x" size={16}/></button>
                            </header>
                            
                            <div className="flex-1 overflow-y-auto p-6 space-y-6">
                                <div className="bg-slate-50 p-5 rounded-2xl border border-slate-100 space-y-4">
                                    <div className="flex justify-between border-b pb-2"><span className="text-xs font-bold text-slate-400 uppercase">Estado</span><span className="text-xs font-black text-slate-800">{data.status}</span></div>
                                    {type === 'Propiedad' && <div className="flex justify-between border-b pb-2"><span className="text-xs font-bold text-slate-400 uppercase">Inquilino</span><span className="text-xs font-black text-slate-800">{data.tenant}</span></div>}
                                    {type === 'Usuario' && <div className="flex justify-between border-b pb-2"><span className="text-xs font-bold text-slate-400 uppercase">Email</span><span className="text-xs font-black text-slate-800">{data.email}</span></div>}
                                    {type === 'Contrato' && <div className="flex justify-between border-b pb-2"><span className="text-xs font-bold text-slate-400 uppercase">Vencimiento</span><span className="text-xs font-black text-slate-800">{data.date}</span></div>}
                                </div>

                                <div className="pt-4 flex flex-col gap-3">
                                    <button className="w-full bg-[#0055DD] text-white py-4 rounded-xl font-black text-xs uppercase tracking-widest shadow-md flex items-center justify-center gap-2"><Icon name="edit" size={16}/> Editar Datos</button>
                                    <button className="w-full bg-white text-rose-500 border border-rose-200 py-4 rounded-xl font-black text-xs uppercase tracking-widest flex items-center justify-center gap-2 hover:bg-rose-50"><Icon name="power-off" size={16}/> Dar de Baja / Pausar</button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            // --- WIZARD: CHAT IA (Para el botón +) ---
            const ChatWizard = () => {
                if (!aiFlow) return null;
                
                const [step, setStep] = useState(0);
                const [input, setInput] = useState('');
                const [isBotTyping, setIsBotTyping] = useState(false);
                const scrollRef = useRef(null);
                
                const flows = {
                    propiedad: [
                        { bot: "¡Hola! Para dar de alta la propiedad, ingresá la dirección exacta." },
                        { bot: "Perfecto. ¿Querés detallar algún extra? (Ej: Cochera, SUM)." },
                        { bot: "¡Propiedad registrada exitosamente en el sistema!" }
                    ],
                    usuario: [
                        { bot: "Vamos a crear un usuario. ¿Cuál es su nombre y apellido?" },
                        { bot: "¿Me pasas su correo electrónico?" },
                        { bot: "¿Qué rol tendrá? (Escribe Inquilino o Propietario)." },
                        { bot: "¡Usuario registrado e invitado a la plataforma!" }
                    ],
                    contrato: [
                        { bot: "Iniciemos el contrato. ¿Cuál es la dirección de la propiedad a asociar?" },
                        { bot: "¿A nombre de qué inquilino estará?" },
                        { bot: "¿Cuál es el monto mensual del alquiler?" },
                        { bot: "¡Borrador de contrato generado y enviado a las partes!" }
                    ]
                };

                const currentFlow = flows[aiFlow];
                const [messages, setMessages] = useState([{ type: 'bot', text: currentFlow[0].bot }]);

                useEffect(() => {
                    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
                }, [messages, isBotTyping]);

                const handleSend = () => {
                    if (!input.trim()) return;
                    const val = input.trim();
                    setInput('');
                    setMessages(prev => [...prev, { type: 'user', text: val }]);
                    
                    if (step < currentFlow.length - 1) {
                        setIsBotTyping(true);
                        setTimeout(() => {
                            setIsBotTyping(false);
                            setStep(step + 1);
                            setMessages(prev => [...prev, { type: 'bot', text: currentFlow[step + 1].bot }]);
                        }, 800);
                    }
                };

                const isFinished = step >= currentFlow.length - 1 && !isBotTyping;

                return (
                    <div className="absolute inset-0 z-[100] bg-white flex flex-col animate-in slide-in-from-right">
                        <header className="p-6 border-b border-slate-50 flex justify-between items-center bg-white shadow-sm">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center text-[#0055DD]">
                                    <Icon name="sparkles" size={20} />
                                </div>
                                <div>
                                    <h2 className="text-sm font-black uppercase tracking-widest text-slate-800 leading-none">Asistente IA</h2>
                                    <p className="text-[10px] text-[#0055DD] font-bold uppercase mt-1">Alta de {aiFlow}</p>
                                </div>
                            </div>
                            <button onClick={() => setAiFlow(null)} className="p-2 bg-slate-50 rounded-full text-slate-400"><Icon name="x" size={20}/></button>
                        </header>
                        
                        <div ref={scrollRef} className="flex-1 overflow-y-auto p-6 space-y-6 bg-[#F0F2F6] no-scrollbar pb-32">
                            {messages.map((m, i) => (
                                <div key={i} className={m.type === 'bot' ? 'bot-bubble' : 'user-bubble animate-in'}>{m.text}</div>
                            ))}
                            {isBotTyping && (
                                <div className="bot-bubble flex items-center gap-1.5 py-4 w-max">
                                    <div className="typing-dot"></div><div className="typing-dot"></div><div className="typing-dot"></div>
                                </div>
                            )}
                            {isFinished && (
                                <div className="pt-6 animate-in">
                                    <button onClick={() => setAiFlow(null)} className="w-full bg-[#0055DD] text-white py-4 rounded-xl font-black text-xs uppercase tracking-widest shadow-xl">Cerrar Asistente</button>
                                </div>
                            )}
                        </div>

                        {!isFinished && !isBotTyping && (
                            <footer className="p-6 bg-white border-t border-slate-100 absolute bottom-0 w-full">
                                <div className="flex gap-3">
                                    <input type="text" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleSend()} placeholder="Escribe aquí..." className="flex-1 bg-slate-50 px-5 py-4 rounded-2xl text-sm font-bold outline-none focus:ring-2 focus:ring-[#0055DD]" autoFocus/>
                                    <button onClick={handleSend} className="w-14 h-14 bg-[#0055DD] text-white rounded-[1.2rem] flex items-center justify-center shadow-lg active:scale-95 transition-transform shrink-0"><Icon name="send" size={20}/></button>
                                </div>
                            </footer>
                        )}
                    </div>
                );
            };

            // --- VISTAS PRINCIPALES ---
            
            const InicioView = () => (
                <div className="flex-1 overflow-y-auto no-scrollbar pb-32 animate-in flex flex-col">
                    <AppHeader />
                    <main className="p-6 space-y-6 -mt-4 relative z-0 flex-1">
                        {/* Tesorería Desglosada */}
                        <div className="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm space-y-4">
                            <div className="flex justify-between items-start">
                                <div>
                                    <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Saldo Total Consolidado</p>
                                    <h2 className="text-3xl font-black text-[#0D1B4B] tracking-tighter mt-1">$4.240.500</h2>
                                </div>
                            </div>
                            
                            <div className="grid grid-cols-3 gap-2 bg-slate-50 p-3 rounded-xl border border-slate-100">
                                <div className="text-center border-r border-slate-200">
                                    <p className="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">Alquileres</p>
                                    <p className="text-xs font-black text-slate-800">$3.000k</p>
                                </div>
                                <div className="text-center border-r border-slate-200">
                                    <p className="text-[9px] font-black text-emerald-500 uppercase tracking-widest mb-1">Comisiones</p>
                                    <p className="text-xs font-black text-emerald-700">$1.200k</p>
                                </div>
                                <div className="text-center">
                                    <p className="text-[9px] font-black text-indigo-500 uppercase tracking-widest mb-1">Intereses</p>
                                    <p className="text-xs font-black text-indigo-700">$40.5k</p>
                                </div>
                            </div>

                            <div className="flex flex-col gap-2">
                                <button onClick={() => setWithdrawMode('dueños')} className="w-full bg-[#0D1B4B] text-white py-3.5 rounded-xl font-black text-[10px] uppercase tracking-widest shadow-lg flex justify-center items-center gap-2 active:scale-95 transition-all">
                                    <Icon name="send" size={14}/> Derivar Alquileres a Dueños
                                </button>
                                <button onClick={() => setWithdrawMode('comisiones')} className="w-full bg-emerald-50 text-emerald-700 border border-emerald-200 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest active:scale-95 transition-all">
                                    Retirar Mis Comisiones
                                </button>
                            </div>
                        </div>

                        {/* Indicadores Cartera */}
                        <div className="space-y-3">
                            <div className="flex justify-between items-center px-1">
                                <h4 className="text-[10px] font-black text-slate-500 uppercase tracking-widest">Indicadores de Cartera</h4>
                                <button onClick={() => setFullMetricsOpen(true)} className="text-[10px] font-black text-[#0055DD] uppercase bg-blue-50 px-2 py-1 rounded">Ver todo</button>
                            </div>
                            <div className="grid grid-cols-3 gap-3">
                                <div className="bg-white p-4 rounded-2xl border shadow-sm flex flex-col items-center text-center">
                                    <span className="w-8 h-8 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center mb-2"><Icon name="check-circle-2" size={16}/></span>
                                    <h5 className="text-xl font-black text-slate-800">42</h5>
                                    <p className="text-[9px] font-bold text-slate-400 uppercase mt-0.5">Activas</p>
                                </div>
                                <div className="bg-white p-4 rounded-2xl border shadow-sm flex flex-col items-center text-center">
                                    <span className="w-8 h-8 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center mb-2"><Icon name="key" size={16}/></span>
                                    <h5 className="text-xl font-black text-slate-800">3</h5>
                                    <p className="text-[9px] font-bold text-slate-400 uppercase mt-0.5">Vacantes</p>
                                </div>
                                <div className="bg-white p-4 rounded-2xl border shadow-sm flex flex-col items-center text-center border-b-2 border-b-rose-500">
                                    <span className="w-8 h-8 rounded-full bg-rose-50 text-rose-600 flex items-center justify-center mb-2"><Icon name="alert-triangle" size={16}/></span>
                                    <h5 className="text-xl font-black text-slate-800">2</h5>
                                    <p className="text-[9px] font-bold text-slate-400 uppercase mt-0.5">En Mora</p>
                                </div>
                            </div>
                        </div>

                        {/* Alertas */}
                        <div className="space-y-3">
                            <h4 className="text-[10px] font-black text-slate-500 uppercase tracking-widest px-1">Atención Requerida</h4>
                            <div className="bg-white p-4 rounded-[1.5rem] border shadow-sm border-l-4 border-l-rose-500 flex items-start gap-4">
                                <div className="w-10 h-10 bg-rose-50 rounded-xl flex items-center justify-center text-rose-600 shrink-0"><Icon name="clock-3" size={20} /></div>
                                <div className="flex-1">
                                    <div className="flex justify-between items-start">
                                        <h5 className="font-black text-slate-800 text-xs">Mora: Av. Colón 450</h5>
                                        <span className="text-[9px] font-black bg-rose-100 text-rose-700 px-1.5 py-0.5 rounded">Día 6</span>
                                    </div>
                                    <p className="text-[10px] text-slate-500 mt-1 leading-tight">La caución está lista para gatillarse.</p>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );

            const PropiedadesView = () => {
                const [search, setSearch] = useState('');
                const filtered = mockPropiedades.filter(p => p.addr.toLowerCase().includes(search.toLowerCase()) || p.owner.toLowerCase().includes(search.toLowerCase()));

                return (
                    <div className="flex-1 overflow-y-auto no-scrollbar pb-32 animate-in flex flex-col bg-[#F0F2F6]">
                        <header className="p-6 bg-white border-b sticky top-0 z-10 flex flex-col gap-4">
                            <h2 className="text-xl font-black text-[#0D1B4B] tracking-tighter">Propiedades</h2>
                            <div className="relative">
                                <Icon name="search" className="absolute left-3 top-3.5 text-slate-300" size={16} />
                                <input type="text" placeholder="Buscar dirección o dueño..." value={search} onChange={e=>setSearch(e.target.value)} className="w-full bg-slate-50 border border-slate-200 p-3 pl-10 rounded-xl text-sm outline-none focus:border-[#0055DD] transition-all font-medium"/>
                            </div>
                        </header>
                        <div className="p-6 space-y-3">
                            {filtered.map((prop, i) => (
                                <div key={i} onClick={() => setSelectedEntity({type: 'Propiedad', data: prop})} className="bg-white p-4 rounded-2xl border shadow-sm cursor-pointer active:scale-95 transition-transform">
                                    <div className="flex justify-between items-start mb-3">
                                        <h4 className="font-black text-slate-800 text-sm">{prop.addr}</h4>
                                        <span className={`text-[9px] font-black uppercase px-2 py-0.5 rounded bg-${prop.statusColor}-50 text-${prop.statusColor}-600`}>{prop.status}</span>
                                    </div>
                                    <div className="flex justify-between text-xs">
                                        <div className="flex flex-col"><span className="text-[9px] font-bold text-slate-400 uppercase">Inquilino</span><span className="font-semibold text-slate-700">{prop.tenant}</span></div>
                                        <div className="flex flex-col text-right"><span className="text-[9px] font-bold text-slate-400 uppercase">Propietario</span><span className="font-semibold text-slate-700">{prop.owner}</span></div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            const UsuariosView = () => {
                const [search, setSearch] = useState('');
                const [tab, setTab] = useState('Inquilino'); // Inquilino / Propietario
                
                const filtered = mockUsuarios
                    .filter(u => u.role === tab)
                    .filter(u => u.name.toLowerCase().includes(search.toLowerCase()) || u.email.toLowerCase().includes(search.toLowerCase()));

                return (
                    <div className="flex-1 overflow-y-auto no-scrollbar pb-32 animate-in flex flex-col bg-[#F0F2F6]">
                        <header className="p-6 bg-white border-b sticky top-0 z-10 flex flex-col gap-4">
                            <h2 className="text-xl font-black text-[#0D1B4B] tracking-tighter">Usuarios</h2>
                            <div className="flex bg-slate-100 p-1 rounded-xl">
                                {['Inquilino', 'Propietario'].map(t => (
                                    <button key={t} onClick={() => setTab(t)} className={`flex-1 py-2 rounded-lg text-[10px] font-black uppercase transition ${tab === t ? 'bg-white text-[#0D1B4B] shadow-sm' : 'text-slate-500'}`}>{t}s</button>
                                ))}
                            </div>
                            <div className="relative">
                                <Icon name="search" className="absolute left-3 top-3.5 text-slate-300" size={16} />
                                <input type="text" placeholder={`Buscar ${tab.toLowerCase()}...`} value={search} onChange={e=>setSearch(e.target.value)} className="w-full bg-slate-50 border border-slate-200 p-3 pl-10 rounded-xl text-sm outline-none focus:border-[#0055DD] transition-all font-medium"/>
                            </div>
                        </header>
                        <div className="p-6 space-y-3">
                            {filtered.map((u, i) => (
                                <div key={i} onClick={() => setSelectedEntity({type: 'Usuario', data: u})} className="bg-white p-4 rounded-2xl border shadow-sm flex items-center justify-between cursor-pointer active:scale-95 transition-transform">
                                    <div className="flex items-center gap-4">
                                        <div className="w-10 h-10 rounded-full bg-blue-50 text-[#0055DD] flex items-center justify-center font-black text-lg border border-blue-100">{u.name.charAt(0)}</div>
                                        <div>
                                            <h4 className="font-black text-slate-800 text-xs">{u.name}</h4>
                                            <p className="text-[10px] text-slate-500 mt-0.5">{u.email}</p>
                                        </div>
                                    </div>
                                    <Icon name="chevron-right" size={18} className="text-slate-300"/>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            const ContratosView = () => {
                const [search, setSearch] = useState('');
                const filtered = mockContratos.filter(c => c.prop.toLowerCase().includes(search.toLowerCase()) || c.id.toLowerCase().includes(search.toLowerCase()));

                return (
                    <div className="flex-1 overflow-y-auto no-scrollbar pb-32 animate-in flex flex-col bg-[#F0F2F6]">
                        <header className="p-6 bg-white border-b sticky top-0 z-10 flex flex-col gap-4">
                            <h2 className="text-xl font-black text-[#0D1B4B] tracking-tighter">Contratos</h2>
                            <div className="relative">
                                <Icon name="search" className="absolute left-3 top-3.5 text-slate-300" size={16} />
                                <input type="text" placeholder="Buscar por ID o dirección..." value={search} onChange={e=>setSearch(e.target.value)} className="w-full bg-slate-50 border border-slate-200 p-3 pl-10 rounded-xl text-sm outline-none focus:border-[#0055DD] transition-all font-medium"/>
                            </div>
                        </header>
                        <div className="p-6 space-y-3">
                            {filtered.map((doc, i) => (
                                <div key={i} onClick={() => setSelectedEntity({type: 'Contrato', data: doc})} className="bg-white p-4 rounded-2xl border shadow-sm flex items-center justify-between cursor-pointer active:scale-95 transition-transform">
                                    <div className="flex items-center gap-4">
                                        <div className="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center"><Icon name="file-text" size={20}/></div>
                                        <div>
                                            <h4 className="font-black text-slate-800 text-xs">{doc.prop}</h4>
                                            <p className="text-[10px] text-slate-500 font-mono mt-0.5">{doc.id} • {doc.date}</p>
                                        </div>
                                    </div>
                                    <span className={`text-[9px] font-black uppercase px-2 py-0.5 rounded ${doc.status === 'Vigente' ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600'}`}>{doc.status}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            // --- MENU ACCIÓN FLOTANTE (FAB) ---
            const FabMenu = () => {
                if (!isFabOpen) return null;
                return (
                    <div className="absolute inset-0 z-40 flex items-end justify-center pb-28 bg-slate-900/40 backdrop-blur-sm slide-up" onClick={() => setIsFabOpen(false)}>
                        <div className="bg-white w-[90%] rounded-3xl p-6 shadow-2xl flex flex-col gap-4" onClick={(e) => e.stopPropagation()}>
                            <h3 className="text-xs font-black text-slate-400 uppercase tracking-widest text-center mb-2">Crear Nuevo Registro</h3>
                            <div className="grid grid-cols-2 gap-3">
                                <button onClick={() => { setAiFlow('propiedad'); setIsFabOpen(false); }} className="p-4 bg-emerald-50 rounded-2xl border border-emerald-100 flex flex-col items-center justify-center gap-2 hover:bg-emerald-100 transition">
                                    <Icon name="home" size={24} className="text-emerald-600"/>
                                    <span className="text-[10px] font-black text-emerald-800 uppercase">Propiedad</span>
                                </button>
                                <button onClick={() => { setAiFlow('usuario'); setIsFabOpen(false); }} className="p-4 bg-blue-50 rounded-2xl border border-blue-100 flex flex-col items-center justify-center gap-2 hover:bg-blue-100 transition">
                                    <Icon name="users" size={24} className="text-[#0055DD]"/>
                                    <span className="text-[10px] font-black text-[#0055DD] uppercase">Usuario</span>
                                </button>
                                <button onClick={() => { setAiFlow('contrato'); setIsFabOpen(false); }} className="p-4 bg-indigo-50 rounded-2xl border border-indigo-100 flex flex-col items-center justify-center gap-2 hover:bg-indigo-100 transition col-span-2">
                                    <Icon name="file-signature" size={24} className="text-indigo-600"/>
                                    <span className="text-[10px] font-black text-indigo-800 uppercase">Contrato Nuevo</span>
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="h-screen w-full flex flex-col items-center justify-center p-4 bg-[#cbd5e1]">
                    <div className="mobile-shell rounded-[3rem] border-[6px] border-white ring-1 ring-slate-200 shadow-2xl">
                        
                        {/* Area de Contenido Dinámico */}
                        {activeTab === 'inicio' && <InicioView />}
                        {activeTab === 'propiedades' && <PropiedadesView />}
                        {activeTab === 'usuarios' && <UsuariosView />}
                        {activeTab === 'contratos' && <ContratosView />}

                        {/* Modales / Overlays */}
                        <ProfileDrawer isProfileOpen={isProfileOpen} setIsProfileOpen={setIsProfileOpen} />
                        <WithdrawModal withdrawMode={withdrawMode} setWithdrawMode={setWithdrawMode} />
                        <FullMetricsModal fullMetricsOpen={fullMetricsOpen} setFullMetricsOpen={setFullMetricsOpen} />
                        <EntityABMModal selectedEntity={selectedEntity} setSelectedEntity={setSelectedEntity} />
                        <ChatWizard aiFlow={aiFlow} setAiFlow={setAiFlow} />
                        <FabMenu />

                        {/* Botón de Acción Flotante (FAB) centralizado */}
                        <button 
                            onClick={() => setIsFabOpen(!isFabOpen)}
                            className={`absolute bottom-[5rem] left-1/2 -translate-x-1/2 w-14 h-14 bg-[#0055DD] text-white rounded-full flex items-center justify-center shadow-[0_10px_25px_rgba(0,85,221,0.5)] z-50 transition-transform duration-300 ${isFabOpen ? 'rotate-45 bg-rose-500 shadow-rose-500/50' : 'active:scale-95 hover:-translate-y-1'}`}
                        >
                            <Icon name="plus" size={28} />
                        </button>

                        {/* Nav inferior */}
                        <nav className="absolute bottom-0 w-full bg-white/95 backdrop-blur-md border-t border-slate-200 px-6 py-4 flex justify-between items-center pb-8 z-30">
                            <button onClick={() => {setActiveTab('inicio'); setIsFabOpen(false);}} className={`flex flex-col items-center gap-1 transition-colors w-12 ${activeTab === 'inicio' ? 'text-[#0055DD]' : 'text-slate-400'}`}>
                                <Icon name="layout-dashboard" size={22} />
                                <span className="text-[8px] font-black uppercase tracking-wider">Inicio</span>
                            </button>
                            <button onClick={() => {setActiveTab('propiedades'); setIsFabOpen(false);}} className={`flex flex-col items-center gap-1 transition-colors w-12 pr-2 ${activeTab === 'propiedades' ? 'text-[#0055DD]' : 'text-slate-400'}`}>
                                <Icon name="building-2" size={22} />
                                <span className="text-[8px] font-black uppercase tracking-wider">Props</span>
                            </button>
                            
                            {/* Espacio vacío para el FAB */}
                            <div className="w-10"></div>

                            <button onClick={() => {setActiveTab('usuarios'); setIsFabOpen(false);}} className={`flex flex-col items-center gap-1 transition-colors w-12 pl-2 ${activeTab === 'usuarios' ? 'text-[#0055DD]' : 'text-slate-400'}`}>
                                <Icon name="users" size={22} />
                                <span className="text-[8px] font-black uppercase tracking-wider">Usrs</span>
                            </button>
                            <button onClick={() => {setActiveTab('contratos'); setIsFabOpen(false);}} className={`flex flex-col items-center gap-1 transition-colors w-12 ${activeTab === 'contratos' ? 'text-[#0055DD]' : 'text-slate-400'}`}>
                                <Icon name="file-text" size={22} />
                                <span className="text-[8px] font-black uppercase tracking-wider">Contratos</span>
                            </button>
                        </nav>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminSuperApp />);
    </script>
</body>
</html>
