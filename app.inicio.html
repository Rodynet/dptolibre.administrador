<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DptoLibre - Inicio Administrador (Torre Mobile)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --brand-blue: #0055DD;
            --brand-dark: #0D1B4B;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #cbd5e1;
            -webkit-tap-highlight-color: transparent;
        }

        .mobile-shell {
            width: 100%;
            height: 100vh;
            max-width: 414px;
            margin: 0 auto;
            background: #F0F2F6;
            position: relative;
            overflow: hidden;
            box-shadow: 0 40px 100px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .animate-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name, size, className]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        function AdminHomeApp() {
            const [activeTab, setActiveTab] = useState('torre');

            // --- VISTAS DEL COMPONENTE ---
            
            const DashboardView = () => (
                <div className="flex-1 overflow-y-auto no-scrollbar pb-24 animate-in">
                    {/* Header Top */}
                    <header className="p-6 bg-slate-900 text-white flex justify-between items-center rounded-b-[2.5rem] shadow-xl relative z-10">
                        <div className="absolute top-4 right-4 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[9px] font-black uppercase px-2 py-0.5 rounded tracking-wider">
                            V4.0
                        </div>
                        <div className="flex items-center gap-3 mt-4">
                            <div className="w-12 h-12 rounded-full border-2 border-emerald-400 overflow-hidden bg-slate-800 flex-shrink-0 relative">
                                <img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?w=150&q=80" alt="Admin" className="w-full h-full object-cover" />
                                <div className="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-slate-900 rounded-full"></div>
                            </div>
                            <div>
                                <h3 className="text-sm font-black leading-tight tracking-tight">Estudio Raíces</h3>
                                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">Admin Partner</p>
                            </div>
                        </div>
                        <button className="relative w-10 h-10 flex items-center justify-center bg-slate-800 hover:bg-slate-700 rounded-xl transition mt-4">
                            <Icon name="bell" size={20} className="text-slate-300" />
                            <span className="absolute top-2 right-2 w-2 h-2 bg-rose-500 rounded-full animate-pulse"></span>
                        </button>
                    </header>

                    <main className="p-6 space-y-6 -mt-4 relative z-0">
                        {/* 1. Tesorería Corta (Honorarios) */}
                        <div className="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm space-y-4">
                            <div className="flex justify-between items-start">
                                <div>
                                    <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Bolsillo Honorarios</p>
                                    <h2 className="text-3xl font-black text-[#0D1B4B] tracking-tighter mt-1">$1.240.500</h2>
                                </div>
                                <span className="bg-emerald-100 text-emerald-700 text-[9px] font-black px-2 py-1 rounded uppercase flex items-center gap-1">
                                    <Icon name="trending-up" size={10}/> +12%
                                </span>
                            </div>
                            <div className="flex gap-2">
                                <button className="flex-1 bg-[#0055DD] text-white py-3 rounded-xl font-black text-[10px] uppercase tracking-widest shadow-md active:scale-95 transition-all">
                                    Retirar
                                </button>
                                <button className="w-12 h-12 bg-blue-50 text-[#0055DD] rounded-xl flex items-center justify-center border border-blue-100 active:scale-95 transition-all">
                                    <Icon name="history" size={18} />
                                </button>
                            </div>
                        </div>

                        {/* 2. Resumen La Torre */}
                        <div className="space-y-3">
                            <div className="flex justify-between items-center px-1">
                                <h4 className="text-[10px] font-black text-slate-500 uppercase tracking-widest">La Torre (Métricas)</h4>
                                <button className="text-[10px] font-bold text-[#0055DD] uppercase">Ver todo</button>
                            </div>
                            <div className="grid grid-cols-3 gap-3">
                                <div className="bg-white p-4 rounded-2xl border shadow-sm flex flex-col items-center text-center">
                                    <span className="w-8 h-8 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center mb-2"><Icon name="check-circle-2" size={16}/></span>
                                    <h5 className="text-xl font-black text-slate-800">42</h5>
                                    <p className="text-[9px] font-bold text-slate-400 uppercase mt-0.5">Activas</p>
                                </div>
                                <div className="bg-white p-4 rounded-2xl border shadow-sm flex flex-col items-center text-center">
                                    <span className="w-8 h-8 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center mb-2"><Icon name="key" size={16}/></span>
                                    <h5 className="text-xl font-black text-slate-800">3</h5>
                                    <p className="text-[9px] font-bold text-slate-400 uppercase mt-0.5">Vacantes</p>
                                </div>
                                <div className="bg-white p-4 rounded-2xl border shadow-sm flex flex-col items-center text-center border-b-2 border-b-rose-500">
                                    <span className="w-8 h-8 rounded-full bg-rose-50 text-rose-600 flex items-center justify-center mb-2"><Icon name="alert-triangle" size={16}/></span>
                                    <h5 className="text-xl font-black text-slate-800">2</h5>
                                    <p className="text-[9px] font-bold text-slate-400 uppercase mt-0.5">En Mora</p>
                                </div>
                            </div>
                        </div>

                        {/* 3. Centro de Acción (Excepciones) */}
                        <div className="space-y-3">
                            <h4 className="text-[10px] font-black text-slate-500 uppercase tracking-widest px-1">Atención Requerida</h4>
                            
                            {/* Alerta de Mora */}
                            <div className="bg-white p-4 rounded-[1.5rem] border shadow-sm border-l-4 border-l-rose-500 flex items-start gap-4">
                                <div className="w-10 h-10 bg-rose-50 rounded-xl flex items-center justify-center text-rose-600 shrink-0">
                                    <Icon name="clock-3" size={20} />
                                </div>
                                <div className="flex-1">
                                    <div className="flex justify-between items-start">
                                        <h5 className="font-black text-slate-800 text-xs">Mora: Av. Colón 450</h5>
                                        <span className="text-[9px] font-black bg-rose-100 text-rose-700 px-1.5 py-0.5 rounded">Día 6</span>
                                    </div>
                                    <p className="text-[10px] text-slate-500 mt-1 leading-tight">Inquilino: L. Martínez. El sistema de caución está listo para gatillarse.</p>
                                    <div className="flex gap-2 mt-3">
                                        <button className="flex-1 bg-rose-50 text-rose-700 py-2 rounded-lg font-black text-[9px] border border-rose-100 uppercase tracking-wider">Aviso WhatsApp</button>
                                        <button className="flex-1 bg-rose-600 text-white py-2 rounded-lg font-black text-[9px] uppercase tracking-wider shadow-sm">Ejecutar Póliza</button>
                                    </div>
                                </div>
                            </div>

                            {/* Ticket Mantenimiento */}
                            <div className="bg-white p-4 rounded-[1.5rem] border shadow-sm border-l-4 border-l-amber-400 flex items-start gap-4">
                                <div className="w-10 h-10 bg-amber-50 rounded-xl flex items-center justify-center text-amber-600 shrink-0">
                                    <Icon name="wrench" size={20} />
                                </div>
                                <div className="flex-1">
                                    <div className="flex justify-between items-start">
                                        <h5 className="font-black text-slate-800 text-xs">Fuga de Agua</h5>
                                        <span className="text-[9px] font-black bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded">Hace 2h</span>
                                    </div>
                                    <p className="text-[10px] text-slate-500 mt-1 leading-tight">Caseros 1230. Inquilino adjuntó foto. Presupuesto estimado IA: $45.000.</p>
                                    <button className="w-full mt-3 bg-slate-900 text-white py-2.5 rounded-lg font-black text-[9px] uppercase tracking-wider shadow-sm flex justify-center items-center gap-2">
                                        Derivar al Propietario <Icon name="arrow-right" size={12}/>
                                    </button>
                                </div>
                            </div>
                        </div>

                    </main>
                </div>
            );

            // Placeholder para otras vistas
            const EmptyView = ({ title }) => (
                <div className="flex-1 flex flex-col items-center justify-center text-center p-8 animate-in">
                    <div className="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center text-slate-300 mb-4">
                        <Icon name="construction" size={32} />
                    </div>
                    <h2 className="text-xl font-black text-slate-800 tracking-tight">{title}</h2>
                    <p className="text-xs text-slate-400 mt-2">Módulo en construcción para el prototipo.</p>
                </div>
            );

            return (
                <div className="h-screen w-full flex flex-col items-center justify-center p-4 bg-[#cbd5e1]">
                    <div className="mobile-shell rounded-[3rem] border-[6px] border-white ring-1 ring-slate-200">
                        
                        {/* Area de Contenido Dinámico */}
                        {activeTab === 'torre' ? <DashboardView /> : <EmptyView title={activeTab.charAt(0).toUpperCase() + activeTab.slice(1)} />}

                        {/* Nav inferior */}
                        <nav className="absolute bottom-0 w-full bg-white/90 backdrop-blur-md border-t border-slate-200 px-6 py-4 flex justify-between items-center pb-8 z-50">
                            <button onClick={() => setActiveTab('torre')} className={`flex flex-col items-center gap-1 transition-colors ${activeTab === 'torre' ? 'text-[#0055DD]' : 'text-slate-400'}`}>
                                <Icon name="layout-dashboard" size={22} className={activeTab === 'torre' ? 'fill-blue-50' : ''}/>
                                <span className="text-[9px] font-black uppercase tracking-wider">Inicio</span>
                            </button>
                            <button onClick={() => setActiveTab('cartera')} className={`flex flex-col items-center gap-1 transition-colors ${activeTab === 'cartera' ? 'text-[#0055DD]' : 'text-slate-400'}`}>
                                <Icon name="building-2" size={22} className={activeTab === 'cartera' ? 'fill-blue-50' : ''}/>
                                <span className="text-[9px] font-black uppercase tracking-wider">Cartera</span>
                            </button>
                            <button onClick={() => setActiveTab('operaciones')} className={`flex flex-col items-center gap-1 transition-colors ${activeTab === 'operaciones' ? 'text-[#0055DD]' : 'text-slate-400'}`}>
                                <Icon name="file-text" size={22} className={activeTab === 'operaciones' ? 'fill-blue-50' : ''}/>
                                <span className="text-[9px] font-black uppercase tracking-wider">Docs</span>
                            </button>
                            <button onClick={() => setActiveTab('perfil')} className={`flex flex-col items-center gap-1 transition-colors ${activeTab === 'perfil' ? 'text-[#0055DD]' : 'text-slate-400'}`}>
                                <div className={`w-6 h-6 rounded-full border-2 overflow-hidden ${activeTab === 'perfil' ? 'border-[#0055DD]' : 'border-slate-300'}`}>
                                    <img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?w=100&q=80" alt="Me" className="w-full h-full object-cover"/>
                                </div>
                                <span className="text-[9px] font-black uppercase tracking-wider">Admin</span>
                            </button>
                        </nav>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminHomeApp />);
    </script>
</body>
</html>
